# daybook config. Precedence: env vars > this file > built-in defaults.
#
# Every string is quoted on purpose. Under YAML 1.1 an unquoted 12:00 is
# the integer 43200, NO is false, and 010 is 8.

watch:
  agents:
    - { source: "claude-code", path: "~/.claude/projects" }
  repos:
    - { path: "~/code", depth: 4 }
  # `git push` updates the local tracking ref, so the unpushed count is
  # already right for anything sent from this machine. Turn this on only
  # to notice pushes made somewhere else; it costs a round trip per repo.
  fetch: false
  ignore: []

window:
  length: "24h"
  # window  — report only messages inside the window (a week-old session
  #           contributes today's work, not its whole history)
  # session — report the entire session, every day it is active
  scope: "window"
  stale_after: "120h"

schedule:
  at: "23:30"
  days: []             # empty = every day
  catch_up: true         # asleep at `at`? run on wake rather than skip the day

identity:
  authors: ["you@example.com", "you@users.noreply.github.com"]
  machine: ""          # empty = hostname; namespaces output files

output:
  # Where the reports land. Somewhere you will actually open — a report
  # you never see is not a report. Note it holds prompt text, so a
  # visible folder is also a visible folder during a screen share.
  root: "~/Desktop/daybook"
  # The bar for repos with no remote, where "shipped" is undefined.
  no_remote: committed      # committed | exclude
  # Markdown is always written. HTML carries screenshots, and is written
  # automatically on any day that has them — so a day with pictures and the
  # day after it can end up with markdown and HTML that disagree. List "html"
  # here to write both every time.
  formats: []             # [] | ["html"]

narrate:
  enabled: false      # uses the claude you are already signed in with
  provider: "auto"        # auto | cli | api | off
  binary: ""
  model: ""           # empty = the API provider's default
  effort: ""          # low | medium | high | xhigh | max (api only)
  timeout: "5m"

# Photograph where a new feature lives in the product, so somebody who was not
# there can find it. See docs/screenshots.md.
#
# TWO GATES, and neither alone does anything: this switch, and `preview: true`
# on a watched folder above. A switch that appears to be on while nothing
# happens is the worst outcome here, so both are asked for separately.
preview:
  enabled: false
  max_photos: 6           # a whole run, not per repo
  per_capability: 1       # so one busy feature cannot take the lot
  # Launch an app that is not already running. Using one you already have up
  # carries no risk; starting one runs project code unattended.
  start_servers: false
  # Photograph as part of the nightly run. This takes over your real browser
  # and acts as you while it does, so it is off unless you ask for it.
  on_schedule: false
  # Narrow the capture to particular repositories by name. The folder gate is
  # matched by a path prefix, so watching one folder that holds twenty repos
  # opts in all twenty; this is how you say which of them you meant. Absent
  # means every repo under a folder marked `preview: true`.
  # repos: ["web", "docs"]
  # One capture session. Much longer than narrate.timeout on purpose: loading
  # pages and clicking through is not comparable to one request.
  timeout: "20m"

privacy:
  # Redaction runs before anything reaches disk. Prompts carry pasted
  # secrets far more often than people expect.
  keep_raw_prompts: true
  redact:
    - { name: "aws-access-key", pattern: "AKIA[0-9A-Z]{16}" }
    - { name: "bearer-token", pattern: "sk-[A-Za-z0-9_-]{20,}" }
    - { name: "github-token", pattern: "gh[pousr]_[A-Za-z0-9]{20,}" }
    - { name: "private-key", pattern: "-----BEGIN [A-Z ]*PRIVATE KEY-----" }

# Group repos into businesses for the shipped-to table. Optional.
# business:
#   - { name: "Acme", repos: ["acme-*", "acme"] }
