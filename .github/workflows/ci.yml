name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # gofmt exits 0 whether or not it found anything, so the check has to be
      # "did it name any files" rather than an exit code.
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "not gofmt'd:"; echo "$out"; exit 1; fi

      # The same check the release runs. Here it fails a PR; there it would fail
      # after the tag already exists, which is a worse place to find out.
      - name: Check installers parse
        shell: bash
        run: |
          set -eu
          sh -n install.sh
          echo "install.sh: ok"
          pwsh -NoProfile -Command '
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path ./install.ps1), [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $errs | ForEach-Object { $_.Message }; exit 1 }
            "install.ps1: ok"
          '
