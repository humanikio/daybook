name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

      # Every target the release builds, built here first. A build only ever
      # tried on Linux hides anything platform-specific until the release job
      # compiles for Windows and finds syscall.Kill does not exist there — by
      # which point the tag is pushed and the release never publishes. This
      # costs a minute and moves that discovery to the pull request.
      - name: Builds for every released platform
        run: |
          set -eu
          for t in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            echo "  $t"
            GOOS="${t%/*}" GOARCH="${t#*/}" go build -o /dev/null ./...
          done
      # gofmt exits 0 whether or not it found anything, so the check has to be
      # "did it name any files" rather than an exit code.
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "not gofmt'd:"; echo "$out"; exit 1; fi

      # The same check the release runs. Here it fails a PR; there it would fail
      # after the tag already exists, which is a worse place to find out.
      - name: Check installers parse
        shell: bash
        run: |
          set -eu
          sh -n install.sh
          echo "install.sh: ok"
          pwsh -NoProfile -Command '
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path ./install.ps1), [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $errs | ForEach-Object { $_.Message }; exit 1 }
            "install.ps1: ok"
          '

      # CI cannot know what the next tag will be, so it cannot check that the
      # section exists. It can check that the file is WELL FORMED, which is
      # where the mistakes actually are — a typo in a heading, or a section
      # with a title and no body. Finding those here costs a PR; finding them
      # at tag time costs a deleted tag and a re-release.
      - name: Changelog is well formed
        shell: bash
        run: |
          set -eu
          fail=0
          prev=""
          while IFS= read -r line; do
            case "$line" in "## "*) ;; *) continue ;; esac
            ver="$(printf '%s' "$line" | awk '{print $2}')"
            case "$ver" in
              v[0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "::error file=CHANGELOG.md::heading is not a version: $line"; fail=1; continue ;;
            esac
            if [ "$ver" = "$prev" ]; then
              echo "::error file=CHANGELOG.md::$ver appears twice"; fail=1
            fi
            body="$(awk -v want="$ver" '
                      g && /^## / { exit }
                      $1 == "##" && $2 == want { g = 1; next }
                      g { print }
                    ' CHANGELOG.md | tr -d '[:space:]')"
            if [ -z "$body" ]; then
              echo "::error file=CHANGELOG.md::$ver has a heading and no body"; fail=1
            fi
            prev="$ver"
          done < CHANGELOG.md
          [ "$fail" -eq 0 ] && echo "changelog ok" || exit 1
