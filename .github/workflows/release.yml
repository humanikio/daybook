name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      # Plain cross-compilation rather than a release tool. The binary is one
      # CGO-free Go program, so this is a loop — and a loop anyone can read
      # beats a config file for a tool they would have to install to audit.
      - name: build
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/daybook-${os}-${arch}"
            [ "$os" = windows ] && out="${out}.exe"
            echo "building $out"
            GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION#v}" \
              -o "$out" ./cmd/daybook
          done
          cp install.sh install.ps1 dist/
          (cd dist && sha256sum * > checksums.txt)
          ls -la dist

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
