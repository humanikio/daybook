name: release

# Cross-compile, sign, and publish on a version tag.
#
# There is no separate dist repo: daybook's source is public, so the release
# lives on this repository and github.token is sufficient. No PAT, no
# cross-repo secret.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # Keyless cosign signs against a short-lived OIDC token from GitHub. Without
  # id-token: write the build succeeds and the SIGN step fails — silently
  # unsigned, which is the worst outcome because the release still publishes.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # describe and diff against the previous tag need more than the
          # single commit a default checkout fetches.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      # Guard the artifacts before building them. An installer that does not
      # parse is worse than a missing one: it is fetched by `curl | sh`, so the
      # error surfaces on a stranger's machine, mid-pipe, with half of it
      # already executed.
      - name: Check installers parse
        shell: bash
        run: |
          set -eu
          sh -n install.sh
          echo "install.sh: ok"
          pwsh -NoProfile -Command '
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path ./install.ps1), [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $errs | ForEach-Object { $_.Message }; exit 1 }
            "install.ps1: ok"
          '

      # Everything here is knowable before a single binary is built, and a
      # release that fails at the end has still burned the whole build.
      - name: Gate the tag
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"

          # A release must say what it is. The release page is where the install
          # docs point and where anyone deciding whether to upgrade looks —
          # publishing a fallback body there is worse than not publishing.
          # Trailing whitespace is invisible in an editor and would fail an
          # exact match, which is a maddening way to lose a release. Leading
          # "## " and the tag are required; anything after the tag is not.
          if ! awk -v want="${TAG}" '
                { sub(/[[:space:]]+$/, "") }
                $1 == "##" && $2 == want { found = 1 }
                END { exit !found }
              ' CHANGELOG.md; then
            echo "::error title=No changelog section::CHANGELOG.md has no \"## ${TAG}\" heading. Add one and re-tag."
            exit 1
          fi
          body=$(awk -v want="${TAG}" '
                   { line = $0; sub(/[[:space:]]+$/, "", line) }
                   g && /^## / { exit }
                   $1 == "##" && $2 == want { g = 1; next }
                   g { print line }
                 ' CHANGELOG.md)
          if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            echo "::error title=Empty changelog section::\"## ${TAG}\" exists but says nothing."
            exit 1
          fi

          # A tag over an unchanged tree is a mistake every time. Note that a
          # BYTE comparison of the binaries cannot catch this: the version
          # string is injected at build time, so two tags never produce
          # identical output however identical the source.
          prev=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            changed=$(git diff --name-only "$prev".."$TAG" | wc -l | tr -d ' ')
            if [ "$changed" -eq 0 ]; then
              echo "::error title=Nothing changed::${TAG} has the same tree as ${prev}."
              exit 1
            fi
            code=$(git diff --name-only "$prev".."$TAG" | grep -c '\.go$' || true)
            echo "since ${prev}: ${changed} files, ${code} of them Go"
            if [ "$code" -eq 0 ]; then
              # Legitimate — the README is how people decide to try this — but
              # it should be a deliberate choice, visible in the log, not a
              # surprise to whoever reads the release later.
              echo "::notice title=Documentation release::No Go files changed since ${prev}. The binaries differ only by the injected version string."
            fi
          fi

      - name: Verify the tree it is about to ship
        run: |
          go vet ./...
          go test ./...

      # Plain cross-compilation rather than a release tool. One CGO-free Go
      # program, so this is a loop — and a loop anyone can read beats a config
      # file they would have to install something to audit.
      - name: Build
        env:
          CGO_ENABLED: '0'
        run: |
          set -eu
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/daybook-${os}-${arch}"
            [ "$os" = windows ] && out="${out}.exe"
            echo "building $out"
            GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION#v}" \
              -o "$out" ./cmd/daybook
          done

      - name: Sign (cosign keyless)
        uses: sigstore/cosign-installer@v3
      - name: Sign binaries
        run: |
          set -eu
          for f in dist/daybook-*; do
            case "$f" in *.sig) continue ;; esac
            cosign sign-blob --yes --output-signature "$f.sig" "$f"
          done
          ls -la dist

      - name: Stage installers and checksums
        run: |
          set -eu
          cp install.sh install.ps1 dist/
          (cd dist && sha256sum daybook-* install.sh install.ps1 > checksums.txt)

      # THE RELEASE PAGE IS WHERE THE INSTALL DOCS POINT. An empty body there is
      # a reader landing on an asset list with nothing telling them what changed
      # or how to install it.
      #
      # A MISSING SECTION DOES NOT FAIL THE RELEASE. The binaries are built and
      # signed by this point, and blocking a correct artifact over prose is the
      # wrong trade. It falls back to something useful and shouts in the job log
      # — the failure being fixed is a SILENT blank, so the fallback must never
      # be silent either.
      - name: Build release notes
        shell: bash
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          awk -v want="${TAG}" '
            grab && /^## / { exit }
            $1 == "##" && $2 == want { grab = 1; next }
            grab { print }
          ' CHANGELOG.md > notes.body || true

          # The gate already refused a tag without a section, so a fallback here
          # would be unreachable code pretending to be a safety net.
          echo "release notes: $(wc -l < notes.body) lines from CHANGELOG.md"

          {
            echo
            echo "---"
            echo
            echo '## Install'
            echo
            echo '**macOS / Linux**'
            echo '```sh'
            echo 'curl -fsSL https://github.com/humanikio/daybook/releases/latest/download/install.sh | sh'
            echo '```'
            echo
            echo '**Windows**'
            echo '```powershell'
            echo 'irm https://github.com/humanikio/daybook/releases/latest/download/install.ps1 | iex'
            echo '```'
            echo
            echo 'Then `daybook init`.'
            echo
            echo '## Verifying a download'
            echo
            echo '```sh'
            echo 'sha256sum -c checksums.txt --ignore-missing'
            echo
            echo 'cosign verify-blob \'
            echo '  --certificate-identity-regexp "^https://github.com/humanikio/daybook/" \'
            echo '  --certificate-oidc-issuer https://token.actions.githubusercontent.com \'
            echo '  --signature daybook-darwin-arm64.sig daybook-darwin-arm64'
            echo '```'
          } >> notes.body

          echo "--- body ---"; cat notes.body

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: notes.body
          files: dist/*
          fail_on_unmatched_files: true
